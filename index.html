<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>T&amp;S Vendor Finder</title>
<style>
  :root {
    --bg: #D6E9FC; --navy: #131F5B; --panel: #fff; --ink: #1d2330; --muted: #667085; --line: #e3e6eb;
    --accent: #3b5bdb; --accent-soft: #edf1ff; --hit: #2b8a3e; --hit-soft: #e9f7ec;
    --miss: #868e96; --miss-soft: #f1f3f5; --warn: #b35c00; --warn-soft: #fff4e6;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
         background: var(--bg); color: var(--ink); font-size: 14px; line-height: 1.45; }
  header { padding: 16px 28px; background: var(--navy); color: #fff; display: flex; align-items: center; gap: 24px; }
  header .logo { height: 48px; flex: none; }
  header h1 { margin: 0 0 4px; font-size: 20px; }
  header p { margin: 0; color: rgba(255,255,255,.8); }
  main { display: grid; grid-template-columns: 400px 1fr; gap: 20px; padding: 20px 28px; align-items: start; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }

  /* ---------- Filters ---------- */
  #filters { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 0 16px 16px;
             position: sticky; top: 16px; max-height: calc(100vh - 32px); overflow-y: auto; }
  .filters-top { display: flex; justify-content: space-between; align-items: center; margin: 0 -16px 8px;
                 padding: 12px 16px; background: var(--navy); color: #fff; position: sticky; top: 0; z-index: 1; }
  .filters-top h2 { font-size: 15px; margin: 0; }
  .filters-top .btn { background: transparent; color: #fff; border-color: rgba(255,255,255,.5); }
  .filters-top .btn:hover { background: rgba(255,255,255,.15); }
  button { font: inherit; cursor: pointer; }
  .btn { border: 1px solid var(--line); background: #fff; border-radius: 6px; padding: 5px 10px; }
  .btn:hover { background: var(--miss-soft); }
  .group-title { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase;
                 color: var(--accent); margin: 18px 0 8px; padding-bottom: 4px; border-bottom: 1px solid var(--line); }
  .field { margin-bottom: 10px; }
  .field-head { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
  .field-head label { font-weight: 600; font-size: 13px; }
  .info-btn { width: 18px; height: 18px; border-radius: 50%; border: 1px solid var(--accent); color: var(--accent);
              background: #fff; font-size: 11px; font-weight: 700; line-height: 1; padding: 0; }
  .info-btn[aria-expanded="true"] { background: var(--accent); color: #fff; }
  .info { display: none; background: var(--accent-soft); border-radius: 6px; padding: 8px 10px; margin-bottom: 6px;
          font-size: 12.5px; }
  .info.open { display: block; }
  .info ul { margin: 6px 0 0; padding-left: 18px; }
  .info li { margin: 2px 0; }
  select { width: 100%; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: #fff; font: inherit; }
  select.set { border-color: var(--accent); background: var(--accent-soft); font-weight: 600; }
  .detects-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .detects-grid .field { margin: 0; }
  .detects-grid label { font-weight: 500; font-size: 12.5px; }

  /* ---------- Results ---------- */
  #results-wrap { min-width: 0; }
  .results-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; flex-wrap: wrap; gap: 8px; }
  .results-top h2 { margin: 0; font-size: 17px; }
  .toggle { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  .toggle button { border: 0; background: #fff; padding: 5px 12px; }
  .toggle button.on { background: var(--accent); color: #fff; }
  .banner { border-radius: 8px; padding: 12px 14px; margin-bottom: 14px; }
  .banner.ok { background: var(--hit-soft); color: var(--hit); border: 1px solid #b2dfbc; }
  .banner.warn { background: var(--warn-soft); color: var(--warn); border: 1px solid #ffd8a8; }
  .banner.empty { background: var(--panel); color: var(--muted); border: 1px dashed var(--line); text-align: center; padding: 40px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; margin-bottom: 12px; }
  .card-head { display: flex; gap: 14px; align-items: flex-start; }
  .rank { flex: none; width: 34px; height: 34px; border-radius: 50%; background: var(--accent); color: #fff;
          display: grid; place-items: center; font-weight: 700; }
  .card-title { flex: 1; min-width: 0; }
  .card-title h3 { margin: 0; font-size: 16px; }
  .card-title a { color: var(--accent); font-size: 12.5px; text-decoration: none; word-break: break-all; }
  .section-tag { display: inline-block; font-size: 11px; color: var(--muted); background: var(--miss-soft);
                 border-radius: 4px; padding: 1px 6px; margin-left: 6px; vertical-align: middle; }
  .score { flex: none; text-align: right; min-width: 110px; }
  .score b { font-size: 18px; }
  .score small { display: block; color: var(--muted); }
  .bar { height: 6px; background: var(--miss-soft); border-radius: 3px; margin-top: 4px; overflow: hidden; }
  .bar span { display: block; height: 100%; background: var(--hit); }
  .summary { margin: 12px 0 10px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { font-size: 12px; border-radius: 12px; padding: 2px 9px; }
  .chip.hit { background: var(--hit-soft); color: var(--hit); }
  .chip.miss { background: var(--miss-soft); color: var(--miss); }
  details { margin-top: 10px; }
  summary { cursor: pointer; color: var(--accent); font-size: 12.5px; }
  table.profile { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 12.5px; }
  table.profile td { border-top: 1px solid var(--line); padding: 4px 6px; vertical-align: top; }
  table.profile td:first-child { color: var(--muted); width: 40%; }
  .tied { color: var(--muted); font-size: 13px; margin-top: 4px; }
</style>
</head>
<body>

<main>
  <aside id="filters">
    <div class="filters-top">
      <h2>Requirements</h2>
      <button class="btn" id="reset">Reset all</button>
    </div>
    <div id="filter-form"></div>
  </aside>

  <section id="results-wrap">
    <div class="results-top">
      <h2 id="results-title">Best-fit vendors</h2>
      <div class="toggle" id="topn">
        <button data-n="3">Top 3</button><button data-n="5" class="on">Top 5</button>
      </div>
    </div>
    <div id="results"></div>
  </section>
</main>

<script>
/* =====================================================================
   FIELD DEFINITIONS (from the matrix legend)
   - options: selectable values. v = value stored in company data,
     l = label shown (defaults to v), d = short explanation.
   - implies: a company value that also satisfies other selections,
     e.g. a "Both" product shape counts as a hit for "Standalone tool".
   ===================================================================== */
const YPN = [
  { v: "Yes", d: "full support" },
  { v: "Partial", d: "at least partial support (vendors with full support also count)" },
  { v: "No", d: "does not handle this" }
];
const YPN_IMPLIES = { "Yes": ["Partial"] };

const FIELDS = [
  // ---- COMPANY INFO ----
  { key: "cat", group: "Company info", label: "Main Category",
    what: "The best-fit high-level category for this company. Many vendors sit in more than one category.",
    options: ["Content moderation", "Deepfake detection", "Child safety", "Fraud & identity", "Policy & compliance",
              "Academic integrity", "Pre-generation security", "Orchestration", "Other"].map(v => ({ v })) },
  { key: "shape", group: "Company info", label: "Product Shape",
    what: "Is it a bare detection tool, a full platform, or both?",
    options: [{ v: "Standalone tool", d: "a bare detection tool / API" },
              { v: "Broader platform", d: "a full platform (workflows, dashboards, other products)" },
              { v: "Both", d: "offers a standalone tool and a broader platform" }],
    implies: { "Both": ["Standalone tool", "Broader platform"] } },
  { key: "pricing", group: "Company info", label: "Pricing Published?",
    what: "Is a real price ever shown without a sales call?",
    options: [{ v: "Yes", d: "a price is published" }, { v: "Quote only", d: "you have to contact sales" },
              { v: "Free tier", d: "there is a free tier or free usage" }] },

  // ---- POLICY & SPECIALIZATION ----
  { key: "policy", group: "Policy & specialization", label: "Policy-Based vs Fixed Taxonomy",
    what: "Can the customer define their own policy in plain language, or is the taxonomy fixed by the vendor?",
    options: [{ v: "Policy-based", d: "you write or configure your own policy" },
              { v: "Fixed taxonomy", d: "the vendor's categories are fixed" },
              { v: "Both", d: "offers both modes" },
              { v: "N/A", d: "not a moderation tool" }],
    implies: { "Both": ["Policy-based", "Fixed taxonomy"] } },
  { key: "spec", group: "Policy & specialization", label: "Specialized vs Generalized",
    what: "Does the company do one detection job well, or orchestrate/cover many?",
    options: [{ v: "Specialized", d: "does one detection job deeply" },
              { v: "Generalized", d: "covers many jobs / orchestration platform" }] },
  { key: "vert", group: "Policy & specialization", label: "Vertical vs Horizontal",
    what: "A deep fit for one industry/use case (vertical) vs industry-agnostic (horizontal).",
    options: [{ v: "Vertical", d: "deep fit for one industry" }, { v: "Horizontal", d: "industry-agnostic" }] },

  // ---- CONTENT TYPE COVERAGE ----
  { key: "text",  group: "Content type coverage", label: "Text",  detects: true, options: YPN, implies: YPN_IMPLIES },
  { key: "image", group: "Content type coverage", label: "Image", detects: true, options: YPN, implies: YPN_IMPLIES },
  { key: "video", group: "Content type coverage", label: "Video", detects: true, options: YPN, implies: YPN_IMPLIES },
  { key: "audio", group: "Content type coverage", label: "Audio / Voice", detects: true, options: YPN, implies: YPN_IMPLIES },
  { key: "code",  group: "Content type coverage", label: "Code",  detects: true, options: YPN, implies: YPN_IMPLIES },
  { key: "ling", group: "Content type coverage", label: "Text: Linguistic / Slang / Obfuscation Depth",
    what: "For text detectors only: does it handle slang, coded language, symbols and deliberate obfuscation, not just literal keyword matching?",
    options: [{ v: "Yes", d: "handles slang, algospeak, obfuscation" }, { v: "No", d: "no depth claimed or disclosed" },
              { v: "N/A", d: "doesn't detect natural-language text" }] },

  // ---- BEHAVIORAL / ADAPTABILITY ----

// Normalise: every field value becomes an array
COMPANIES.forEach(c => FIELDS.forEach(f => {
  const v = c[f.key];
  c[f.key] = v == null ? [] : Array.isArray(v) ? v : [v];
}));

const selections = {};   // key -> selected value
let topN = 5;

function companyHas(c, f, val) {
  const vals = c[f.key];
  if (vals.includes(val)) return true;
  const imp = f.implies || {};
  return vals.some(v => (imp[v] || []).includes(val));
}
function optLabel(f, v) {
  const o = f.options.find(o => o.v === v);
  return o ? (o.l || o.v) : v;
}
function esc(s) {
  return String(s).replace(/[&<>"']/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
}

// ---------- Build the filter form ----------
function buildForm() {
  const form = document.getElementById("filter-form");
  let html = "", lastGroup = null, detectsOpen = false;

  FIELDS.forEach(f => {
    if (f.group !== lastGroup) {
      if (detectsOpen) { html += "</div>"; detectsOpen = false; }
      html += `<div class="group-title">${esc(f.group)}</div>`;
      lastGroup = f.group;
    }
    const opts = f.options.map(o => {
      const n = COMPANIES.filter(c => companyHas(c, f, o.v)).length;
      return `<option value="${esc(o.v)}">${esc(o.l || o.v)} (${n})</option>`;
    }).join("");
    const select = `<select id="sel-${f.key}" data-key="${f.key}"><option value="">— Any (not scored) —</option>${opts}</select>`;

    if (f.detects) {
      if (!detectsOpen) {
        html += `<div class="field">
          <div class="field-head"><label>Detects (content types)</label>${infoBtn("detects")}</div>
          ${infoPanel("detects", DETECTS_WHAT, YPN)}</div><div class="detects-grid">`;
        detectsOpen = true;
      }
      html += `<div class="field"><div class="field-head"><label for="sel-${f.key}">${esc(f.label)}</label></div>${select}</div>`;
      return;
    }
    if (detectsOpen) { html += "</div>"; detectsOpen = false; }
    html += `<div class="field">
      <div class="field-head"><label for="sel-${f.key}">${esc(f.label)}</label>${infoBtn(f.key)}</div>
      ${infoPanel(f.key, f.what, f.options)}
      ${select}</div>`;
  });
  if (detectsOpen) html += "</div>";
  form.innerHTML = html;

  form.querySelectorAll("select").forEach(s => s.addEventListener("change", e => {
    const k = e.target.dataset.key;
    if (e.target.value) selections[k] = e.target.value; else delete selections[k];
    e.target.classList.toggle("set", !!e.target.value);
    render();
  }));
  form.querySelectorAll(".info-btn").forEach(b => b.addEventListener("click", () => {
    const panel = document.getElementById("info-" + b.dataset.for);
    const open = panel.classList.toggle("open");
    b.setAttribute("aria-expanded", open);
  }));
}
function infoBtn(id) {
  return `<button type="button" class="info-btn" data-for="${id}" aria-expanded="false" title="What does this mean?">i</button>`;
}
function infoPanel(id, what, options) {
  const items = options.map(o => `<li><b>${esc(o.l || o.v)}</b>${o.d ? " — " + esc(o.d) : ""}</li>`).join("");
  return `<div class="info" id="info-${id}"><div><b>What it means:</b> ${esc(what)}</div>
    <div style="margin-top:6px"><b>Suggested values:</b></div><ul>${items}</ul></div>`;
}

// ---------- Scoring & results ----------
function render() {
  const out = document.getElementById("results");
  const active = FIELDS.filter(f => selections[f.key]);
  const total = active.length;

  if (!total) {
    out.innerHTML = `<div class="banner empty">Choose at least one requirement on the left to rank vendors.<br>
      Leave anything you don't care about blank; blank fields aren't scored.</div>`;
    return;
  }

  const scored = COMPANIES.map(c => {
    const checks = active.map(f => ({ f, want: selections[f.key], hit: companyHas(c, f, selections[f.key]) }));
    return { c, checks, score: checks.filter(x => x.hit).length };
  }).sort((a, b) => b.score - a.score || a.c.name.localeCompare(b.c.name));

  const perfect = scored.filter(s => s.score === total);
  let banner;
  if (perfect.length === 1) {
    banner = `<div class="banner ok"><b>1 vendor matches all ${total} requirement${total > 1 ? "s" : ""}.</b> It's ranked first, followed by the next closest matches.</div>`;
  } else if (perfect.length > 1) {
    banner = `<div class="banner ok"><b>${perfect.length} vendors match all ${total} requirement${total > 1 ? "s" : ""}.</b> Add more requirements to narrow the list down.</div>`;
  } else {
    banner = `<div class="banner warn"><b>No vendor matches all ${total} requirements.</b> The best score is ${scored[0].score}/${total}. These are the closest matches:</div>`;
  }

  const shown = scored.slice(0, topN);
  const cutoff = shown[shown.length - 1].score;
  const tiedExtra = scored.slice(topN).filter(s => s.score === cutoff && cutoff > 0);

  let html = banner;
  let rank = 0, prevScore = null;
  shown.forEach((s, i) => {
    if (s.score !== prevScore) { rank = i + 1; prevScore = s.score; }
    html += card(s, rank, total);
  });
  if (tiedExtra.length) {
    html += `<div class="tied">Also tied at ${cutoff}/${total}: ${tiedExtra.map(s => esc(s.c.name)).join(", ")}</div>`;
  }
  out.innerHTML = html;
}

function card(s, rank, total) {
  const { c, checks, score } = s;
  const pct = Math.round(score / total * 100);
  const chips = checks.map(x => {
    const want = esc(optLabel(x.f, x.want));
    if (x.hit) return `<span class="chip hit">✓ ${esc(x.f.label)}: ${want}</span>`;
    const has = c[x.f.key].length ? c[x.f.key].map(v => optLabel(x.f, v)).join(", ") : "not disclosed";
    return `<span class="chip miss" title="This vendor: ${esc(has)}">✗ ${esc(x.f.label)}: ${want} (is: ${esc(has)})</span>`;
  }).join("");
  const rows = FIELDS.map(f => `<tr><td>${esc(f.detects ? "Detects: " + f.label : f.label)}</td>
      <td>${c[f.key].length ? esc(c[f.key].map(v => optLabel(f, v)).join(", ")) : "—"}</td></tr>`).join("");

  return `<div class="card">
    <div class="card-head">
      <div class="rank">${rank}</div>
      <div class="card-title">
        <h3>${esc(c.name)}<span class="section-tag">${esc(c.section)}</span></h3>
        <a href="${esc(c.url)}" target="_blank" rel="noopener">${esc(c.url)}</a>
      </div>
      <div class="score"><b>${score}/${total}</b><small>${pct}% match</small>
        <div class="bar"><span style="width:${pct}%"></span></div></div>
    </div>
    <p class="summary">${esc(c.summary)}</p>
    <div class="chips">${chips}</div>
    <details><summary>Full profile</summary><table class="profile">${rows}</table></details>
  </div>`;
}

// ---------- Wiring ----------
document.getElementById("reset").addEventListener("click", () => {
  Object.keys(selections).forEach(k => delete selections[k]);
  document.querySelectorAll("#filter-form select").forEach(s => { s.value = ""; s.classList.remove("set"); });
  render();
});
document.querySelectorAll("#topn button").forEach(b => b.addEventListener("click", () => {
  topN = +b.dataset.n;
  document.querySelectorAll("#topn button").forEach(x => x.classList.toggle("on", x === b));
  render();
}));

buildForm();
render();
</script>
</body>
</html>
